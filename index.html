<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CU Robotics - Competitive ARC Robotics team at the University of Colorado Boulder. Design. Build. Code. Compete.">
  <meta name="keywords" content="CU Robotics, ARC, robotics, University of Colorado, Boulder, competition, engineering">
  <meta name="theme-color" content="#CFB87C">

  <title>CU Robotics | ARC Competition Team at CU Boulder</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="apple-touch-icon" href="images/logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home-page">
  <div id="site-header"></div>

  <!-- Hero Section -->
  <section class="hero">
    <!-- Parallax Background -->
    <div class="hero-parallax" data-speed="0.3">
      <img src="images/reflection_robots.jpg" alt="CU Robotics Competition">
    </div>

    <!-- Overlays -->
    <div class="hero-overlay"></div>
    <!-- Content -->
    <div class="container hero-content">
      <h1 class="hero-title">
        <span class="line-1">University of Colorado Boulder</span>
        <span class="line-2">CU <span class="gold">Robotics</span></span>
      </h1>

      <div class="hero-cta">
        <a href="https://discord.gg/Ym2kEbnNzg" target="_blank" rel="noopener" class="btn btn-outline btn-lg" style="border-color:#5865F2;color:#5865F2;display:inline-flex;align-items:center;gap:8px;"><img src="images/discord-icon.png" alt="" style="width:20px;height:20px;">Join Our Discord</a>
        <a href="https://forms.gle/WEQET7xzyizAgc7LA" target="_blank" rel="noopener" class="btn btn-outline btn-lg">Apply to Team</a>
      </div>
    </div>

    <!-- Scroll Indicator -->
    <div class="scroll-indicator">
      <span>Scroll</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </div>
  </section>

  <!-- Mission Section -->
  <section id="about" class="section mission">
    <div class="container">
      <div class="content-block">
        <!-- RoboMaster Highlights -->
        <div class="mission-video animate-on-scroll">
          <div class="video-container">
            <iframe
              src="https://www.youtube.com/embed/O2fp67X3vsg"
              title="RoboMaster Highlights"
              frameborder="0"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen>
            </iframe>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Competition Image -->
  <section class="section competition-image-section">
    <div class="container">
      <div class="content-block">
        <img class="competition-image" src="images/robots_at_comp.png" alt="CU Robotics at Competition">
      </div>
    </div>
  </section>

  <!-- Robot Showcase Section -->
  <section id="robot-showcase" class="section robot-showcase">
    <div class="container">
      <div class="content-block">
        <div class="text-center animate-on-scroll mb-xl">
          <h2>Robot <span class="text-gold">Showcase</span></h2>
        </div>

        <!-- 3D Viewer -->
      <div class="robot-viewer-container animate-on-scroll scale">
        <div id="robot-viewer" class="robot-viewer">
          <!-- Tap to Load Overlay (mobile) -->
          <div class="viewer-tap-overlay" id="viewer-tap-overlay">
            <div class="tap-overlay-content">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
              <span>Tap to Load 3D Model</span>
            </div>
          </div>

          <!-- Viewer Header -->
          <div class="robot-viewer-header">
            <span class="viewer-title">3D Model Viewer</span>
            <div class="viewer-controls">
              <button class="viewer-btn" data-action="zoom-in" title="Zoom In">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="M21 21l-4.35-4.35"/>
                  <path d="M11 8v6"/>
                  <path d="M8 11h6"/>
                </svg>
              </button>
              <button class="viewer-btn" data-action="zoom-out" title="Zoom Out">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"/>
                  <path d="M21 21l-4.35-4.35"/>
                  <path d="M8 11h6"/>
                </svg>
              </button>
              <button class="viewer-btn" data-action="reset" title="Reset View">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                  <path d="M3 3v5h5"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Canvas container (Three.js renders here) -->
          <div class="viewer-canvas"></div>

          <!-- Loading State -->
          <div class="viewer-loading hidden">
            <div class="loading-spinner"></div>
            <span class="loading-text">Loading 3D Model...</span>
          </div>

          <!-- Placeholder State -->
          <div class="viewer-placeholder">
            <div class="placeholder-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
                <line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
            </div>
            <h4 class="text-gold">3D Model Coming Soon</h4>
            <p class="text-muted mt-sm">Add a .glb or .gltf file to the models folder and update robots.json</p>
          </div>

          <!-- Footer Controls -->
          <div class="robot-viewer-footer">
            <span class="mono text-muted" style="font-size: 0.75rem;">Drag to rotate • Scroll to zoom</span>
          </div>
        </div>
      </div>

        <!-- Robot Selector (commented out) -->
        <!--
        <div class="robot-selector robots-container animate-on-scroll">
        </div>
        -->
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Three.js (loaded from CDN) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>

  <!-- Main Scripts -->
  <script src="js/components.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/main.js"></script>
  <script src="js/robot-viewer.js"></script>
  <script>
    loadHeader('home'); loadFooter();
  </script>
</body>
</html>
