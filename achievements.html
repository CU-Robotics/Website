<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CU Robotics achievements and awards - See our competition results and accolades in ARC Robotics.">
  <meta name="theme-color" content="#CFB87C">

  <title>Achievements | CU Robotics</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/cu-robotics-logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="subpage achievements-page" data-page="achievements">
  <div id="site-header"></div>

  <!-- Achievements Section -->
  <section class="section">
    <div class="container">
      <!-- Summary Stats -->
      <div class="stats-grid stats-grid-4 animate-on-scroll mb-2xl">
        <div class="stat-item">
          <div class="achievement-stat-number">5</div>
          <div class="stat-label">Seasons Competing</div>
        </div>
        <div class="stat-item">
          <div class="achievement-stat-number">1</div>
          <div class="stat-label">Championship Win</div>
        </div>
        <div class="stat-item">
          <div class="achievement-stat-number">3</div>
          <div class="stat-label">Top 2 Finishes</div>
        </div>
        <div class="stat-item">
          <div class="achievement-stat-number">4</div>
          <div class="stat-label">Podium Placements</div>
        </div>
      </div>

      <!-- Timeline Container (populated by JavaScript) -->
      <div class="achievements-timeline achievements-container">
        <!-- Loading placeholder -->
        <div class="text-center">
          <div class="loading-spinner loading-spinner-centered"></div>
          <p class="text-muted mt-md">Loading achievements...</p>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="js/site.js"></script>
  <script src="js/components.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
