<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The companies that sponsor CU Robotics, and how to join them.">
  <meta name="theme-color" content="#000000">

  <title>Sponsors | CU Robotics</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/cu-robotics-logo.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css?v=20260926-2">
  <link rel="stylesheet" href="css/sponsors.css?v=20261003-6">
</head>
<body class="subpage sponsors-page" data-page="sponsors">
  <div id="site-header"></div>

  <main id="main-content">
  <header class="sponsors-intro container">
    <h1>Sponsors</h1>
    <div class="sponsors-intro-foot">
      <p class="sponsors-lede">Thanks to the companies that help a student team design, build, and compete with robots.</p>
      <div class="sponsors-intro-actions">
        <a class="btn btn-outline btn-lg" href="docs/sponsorship-packet-2026-27.pdf" target="_blank" rel="noopener">Sponsorship packet <span class="btn-note">PDF</span></a>
        <a class="btn btn-lg" href="mailto:curobotics@colorado.edu?subject=Sponsoring%20CU%20Robotics">Become a sponsor</a>
      </div>
    </div>
  </header>

  <!-- Only tiers with companies are listed, top tier first. To add a tier,
       copy a .tier section and use tier-sponsor, tier-supporter, or
       tier-backer; logo slots shrink with each step down. -->
  <section class="tiers" aria-label="Sponsor tiers">
    <div class="container">
      <section class="tier tier-supporter" aria-labelledby="tier-supporter">
        <div class="tier-head">
          <h2 class="tier-name" id="tier-supporter">Supporter</h2>
        </div>
        <ul class="tier-logos">
          <li>
            <a class="tier-slot" href="https://www.patternlabs.ai" target="_blank" rel="noopener">
              <img src="images/pattern-labs-logo-white.png" alt="Pattern Labs" width="1189" height="282" loading="lazy">
              <span class="tier-slot-cta">patternlabs.ai <span aria-hidden="true">↗</span></span>
            </a>
          </li>
        </ul>
      </section>
    </div>
  </section>

  <!-- Closing ask, in the same gold band as the home page's meeting times. -->
  <section class="sponsor-ask" aria-labelledby="ask-heading">
    <div class="container sponsor-ask-grid">
      <h2 id="ask-heading">Want your logo here?</h2>
      <div class="sponsor-ask-links">
        <a class="sponsor-ask-link" href="docs/sponsorship-packet-2026-27.pdf" target="_blank" rel="noopener">2026–27 sponsorship packet (PDF) <span aria-hidden="true">↗</span></a>
        <a class="sponsor-ask-link" href="mailto:curobotics@colorado.edu?subject=Sponsoring%20CU%20Robotics">curobotics@colorado.edu <span aria-hidden="true">↗</span></a>
      </div>
    </div>
  </section>
  </main>

  <div id="site-footer"></div>

  <!-- Scripts -->
  <script src="js/site.js?v=20261003-1"></script>
  <script src="js/components.js?v=20261003-1"></script>
  <script src="js/main.js?v=20260926-1"></script>
</body>
</html>
